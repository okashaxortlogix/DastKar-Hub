version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL 16 Enterprise Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dastkar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dastkar_hub}
      POSTGRES_USER: ${DB_USERNAME:-dastkar_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretPostgres2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dastkar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dastkar_admin} -d ${DB_DATABASE:-dastkar_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis 7 for Sessions, Cache, and Asynchronous Queues
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dastkar-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisSecret2026!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - dastkar-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecret2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Laravel REST API Backend (PHP 8.2 FPM)
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: dastkar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - storage_data:/var/www/html/storage/app
    networks:
      - dastkar-network

  # -------------------------------------------------------------
  # Queue Worker for Notifications, Emails, and Courier Webhooks
  # -------------------------------------------------------------
  queue-worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: dastkar-queue-worker
    restart: unless-stopped
    command: php artisan queue:work redis --queue=default,notifications,payments --tries=3 --timeout=90
    depends_on:
      - backend
      - redis
    env_file:
      - .env.production
    networks:
      - dastkar-network

  # -------------------------------------------------------------
  # Scheduler for Recurring Jobs and Artisan Tasks
  # -------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: dastkar-scheduler
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    depends_on:
      - backend
    env_file:
      - .env.production
    networks:
      - dastkar-network

  # -------------------------------------------------------------
  # React 19 Frontend Web SPA
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: dastkar-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - dastkar-network

networks:
  dastkar-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
